<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Grid</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Jost&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Jost', sans-serif;
  background:#f5f1e8;
  color:#222;
}

nav {
  position:sticky;
  top:0;
  background:#fff;
  padding:15px;
  display:flex;
  justify-content:space-around;
  border-bottom:1px solid #ddd;
}

nav a {
  text-decoration:none;
  color:#333;
  font-weight:600;
}

.container {
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card {
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

h1,h2 {
  font-family:'Cormorant Garamond', serif;
}

/* LOGIN */
#loginScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:#f5f1e8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input {
  padding:10px;
  margin:10px;
}

button {
  padding:10px 20px;
  border:none;
  background:#222;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>Enter Password</h2>
  <input type="password" id="passwordInput">
  <button onclick="login()">Enter</button>
</div>

<!-- APP -->
<div id="appContent" style="display:none;">

<nav>
  <a href="#">Personal Grid</a>
  <a href="#">Health</a>
  <a href="#">Forex</a>
  <a href="#">Travel</a>
</nav>

<div class="container">

<div class="card">
  <h2>💧 Water</h2>
  <p id="water">0 L</p>
</div>

<div class="card">
  <h2>🚶 Steps</h2>
  <p id="steps">0</p>
</div>

<div class="card">
  <h2>🔥 Calories</h2>
  <p id="calories">0</p>
</div>

<div class="card">
  <h2>😴 Sleep</h2>
  <p id="sleep">0 hrs</p>
</div>

<div class="card">
  <h2>📈 Forex P&L</h2>
  <p id="pnl">$0</p>
</div>

<div class="card">
  <h2>🤖 AI Assistant</h2>
  <input id="aiInput" placeholder="Ask something...">
  <button onclick="askAI()">Ask</button>
  <p id="aiResponse"></p>
</div>

</div>

</div>

<script>
const password = "1234";

function login() {
  const input = document.getElementById("passwordInput").value;

  if (input === password) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appContent").style.display = "block";
    localStorage.setItem("auth","true");
  } else {
    alert("Wrong password");
  }
}

window.onload = () => {
  if(localStorage.getItem("auth")==="true"){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("appContent").style.display="block";
  }
};

async function askAI(){
  let input=document.getElementById("aiInput").value;
  let res=await fetch("https://api.affiliateplus.xyz/api/chatbot?message="+input);
  let data=await res.json();
  document.getElementById("aiResponse").innerText=data.message;
}
</script>

</body>
</html>
